name: expression-lab
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: expression
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Chay RUN.bat hoac scripts/setup.py truoc}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok"']
      interval: 5s
      timeout: 5s
      retries: 20
    # MongoDB is private to the Docker network; no host port is exposed.
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    environment:
      MONGO_URI: mongodb://expression:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: expression_lab
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@expressionlab.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Chay RUN.bat hoac scripts/setup.py truoc}
      ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8010},http://127.0.0.1:${APP_PORT:-8010}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - app-data:/app/data
      - model-data:/app/models
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 45s
      retries: 15
    init: true
    stop_grace_period: 30s
volumes:
  mongo-data:
  app-data:
  model-data:
